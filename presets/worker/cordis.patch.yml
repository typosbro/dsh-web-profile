# Agent preset worker: the lean child preset.
#
# Why this exists: the 2026 audit of the harness found that per-agent tool-schema
# pruning was claimed in the design but never built — every child inherited the
# orchestrator's full surface (schedule, jobs, web, present, plugin manager, ralph,
# workflow, delegation). That is resident schema cost on every child turn, and the
# 2026 evidence says over-scaffolding a capable model hurts more than it helps.
#
# A worker gets: instructions, the filesystem, bash, background jobs, skills, todos,
# compaction. It does not get: delegation, workflow, ralph, scheduling, web fetch or
# search, presentation, plugin management, goals, plan mode, or ask-user. If a slice
# needs one of those, the Lead does it, not the worker.
- insert:
    - id: preset-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: worker
        name: Worker
        description: Executes one assigned slice end to end, runs the repo gate, reports receipts. No delegation, no deploys, no external sends.
        order: 4
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a worker. Execute the assigned slice end to end. Do not delegate, do not change the plan, do not deploy, do not send anything external, and do not touch files outside the declared scope. Run the repository gate before you report. Report verdict first, then receipts (a path with a line, or a command output). If the slice cannot be completed, say what blocked it in one line and stop.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: compaction-tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
