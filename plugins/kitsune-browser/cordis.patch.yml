# Live browser for DSH: the owner's everyday Firefox/Zen window through the pinned
# Kitsune MCP server (kitsune-browser-mcp 0.7.3, launched by uvx). Needs uv and the
# Kitsune extension in the browser. No Chromium, no Playwright.
#
# This is the owner's logged-in profile. The live-browser rules in agent-kit's
# instructions/AGENTS.md apply: one step then re-read, background tabs, read-only first.
#
# `command` is absolute on purpose. The DSH web host starts under launchd with
# PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:.../.local/share/pnpm and no
# ~/.local/bin, so a bare `uvx` fails at spawn with ENOENT and the server silently
# never connects (verified 2026-11-08; a PATH-registered entry in ~/.claude.json
# failed the same health check). On another machine point this at its own uvx, or
# use scripts/kitsune-call.py, which resolves uvx itself.
- insert:
    - id: kitsune-browser
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: kitsune
        transport: stdio
        command: /Users/typosbro/.local/bin/uvx
        args:
          - --from
          - kitsune-browser-mcp==0.7.3
          - kitsune
        toolCallTimeoutMs: 180000
        failOnStartupError: false
