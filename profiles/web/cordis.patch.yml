# Your patch layer for this dsh profile, applied after every bundle layer.
# Rows below come from dsh-web-profile (2026-10-23). mobile-shell and web-pwa
# were deliberately declined; the earlier local-no-browser-auth row is replaced
# by remote-auth.

# Token-free access for trusted authorities. Loopback (127.0.0.1) is always
# exempt, so the local GUI opens on a clean URL; the Host/Origin fence still
# refuses any authority that was never declared trusted.
- insert:
    - id: remote-auth
      name: ./remote-auth/index.mjs

# Repository stop gate: a checkpoint that refuses to end a turn while the
# repository's own gate fails. Max two blocks, so pre-existing breakage cannot
# trap a turn.
- insert:
    - id: stop-gate
      name: ./gate/index.mjs

# Cross-session messaging: one session can address any live session by id or
# working directory.
- insert:
    - id: session-message
      name: ./session-message/index.mjs

# The DeepSeek package inventory plugin is a marketplace surface and adds network
# calls at boot on a box that does not use it.
- id: plugin-package-inventory-deepseek
  disabled: true

# Permission presets. Owner decision 2026-10-23: danger-full-access is the
# default (this machine is single-user and the agent edits outside the workspace
# constantly). Switch presets in the UI; approvals are never asked in this mode.
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access

- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    fontSize: 17

# Model routes. OpenCode Go (pre-existing, kept as the fallback):
#   OPENCODE_GO_API_KEY in ~/.dsh/.env.
# Anthropic/Claude subscription (2026-10-27): no apiKeyEnv on purpose — the
# Claude Pro/Max OAuth grant lives in ~/.dsh/.credentials.yaml as the record
# llm-pi-ai/anthropic (kind: grant), the same record dsh's authorization seam
# writes for a "Sign in with Claude" flow. An apiKeyEnv here would outrank that
# grant, and an unresolvable reference would fail the route.
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
      anthropic:
        displayName: Anthropic (Claude Pro/Max)
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
    reasoningEffort: max

# Tool-web provider selection. The base bundle mounts two fetch providers
# (`http` from web-fetch-http and `deepseek-fetch-api` from web-deepseek-api), so
# every web_fetch call fails with "multiple usable web providers are registered".
# Name both providers explicitly. This duplicates plugins/web-search/cordis.patch.yml
# so the fix lands on the live process (bundle patches are not hot-reloaded) and on a
# fresh bootstrap. A config override replaces the row, so both keys are required.
- id: web
  config:
    searchProvider: local-duckduckgo
    fetchProvider: http

# The DeepSeek account plugin polls /auth-api/v0/users/current with a session that
# is not authenticated and logs a 403 on every retry. The API-key route
# (llm-deepseek) is what model access actually uses; the account surface is not.
- id: llm-deepseek-account
  disabled: true

# Discord adapter: enabled, allowlisted to the private "agents" guild, with the
# guild owner authorized as a member. The bot token lives in the host credential
# store (DSH_DISCORD_BOT_TOKEN), never here.
- id: dsh-discord
  config:
    enabled: true
    # Fill these in Settings → Discord on the restored machine (snowflake ids).
    allowedGuildIds: []
    memberUserIds: []
