# dsh-web-profile — patch layer for the `web` profile.
#
# Applied after every bundle layer. Every row here exists for a reason; see
# docs/why-these-rows.md before deleting one.

# Token-free access for the authorities this deployment declares trusted.
# Exempts loopback plus every `trustedHosts` entry, so a phone on the tailnet can
# keep a durable URL (and QR code) instead of a per-process ?token= link. The
# Host/Origin fence is untouched: an authority that was never declared trusted is
# still refused before authentication is consulted. Replaces the earlier
# no-browser-auth.mjs, which hardcoded one author's public hostname.
- insert:
    - id: remote-auth
      name: ./remote-auth/index.mjs

# Phone-first shell: the sidebar becomes an overlay drawer, the settings nav
# stacks, the shell pins to the dynamic viewport (composer clears mobile browser
# chrome), safe-area insets apply, and pull-to-refresh is off.
- insert:
    - id: mobile-shell
      name: ./mobile-shell/index.mjs

# Installable PWA: a real manifest with 192/512/maskable icons, so Chrome offers
# a WebAPK install instead of a bookmark. No service worker on purpose: the app
# is a live websocket client and a cache would risk serving a stale shell.
- insert:
    - id: web-pwa
      name: ./web-pwa/host.mjs

# The DeepSeek package inventory plugin is a marketplace surface, not a runtime
# dependency; it adds network calls at boot on a box that does not use it.
- id: plugin-package-inventory-deepseek
  disabled: true

# Permission presets. The public default is workspace-write: a fresh clone can
# edit its workspace but not the rest of the machine. The author's own box runs
# danger-full-access; flip defaultPreset here if you want that, and understand
# that `approval: never` removes the last prompt before destructive commands.
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: workspace-write

- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    fontSize: 17

# Repository stop gate (portable). The native `agent/turn-stopping` event is
# dispatched serially before a turn boundary commits, and the loop re-reads its
# inbox afterwards, so a listener that steers a message forces another step.
# This replaces the earlier '@deepseek-ai/dsh-hooks-claude-code' row: that package
# is not shipped by the dsh Desktop app and peer-depends on the whole 0.2.1 stack,
# so it could not mount on macOS. gate/index.mjs has no external dependency and
# behaves identically on the CLI and the app.
- insert:
    - id: stop-gate
      name: ./gate/index.mjs

# Cross-session messaging: dsh has no way for one session to address another
# (send_message reaches only the caller's own subagents, and the official
# experimental agent-team bundle is roster-bound to one shared checkout). This row
# registers one tool that addresses any live session by id or working directory.
- insert:
    - id: session-message
      name: ./session-message/index.mjs
